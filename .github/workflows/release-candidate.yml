name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate label shown in the artifact name
        required: true
        default: unsigned

permissions:
  contents: read

jobs:
  build:
    name: Unsigned candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality and security gates
        run: |
          pnpm run ci:check
          pnpm audit --prod --audit-level=moderate
      - name: Build and smoke desktop package
        run: pnpm run dist:desktop
      - name: Build and smoke independent Web server package
        run: pnpm run pack:server
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkterm-desktop-web-${{ inputs.version }}-${{ matrix.os }}-unsigned
          path: |
            release/
            !release/**/win-unpacked/
            !release/**/linux-unpacked/
            !release/**/mac/
          if-no-files-found: error
          retention-days: 14
