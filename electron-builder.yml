appId: com.linkterm.v2
productName: LinkTerm v2
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - apps/desktop/dist/**/*
  - packages/*/dist/**/*
  - package.json
  - node_modules/**/*.node
  - node_modules/**/prebuilds/**/*
  - '!**/*.ldtmp'
  - '!**/*.ldenc'
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: third-party-manifest.json
    to: third-party-manifest.json
  - from: licenses
    to: licenses
extraMetadata:
  main: apps/desktop/dist/main/index.js
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
nsis:
  license: LICENSE
linux:
  target:
    - AppImage
    - deb
  category: Development
